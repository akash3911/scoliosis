<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoliotect Minimal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Scoliotect</h1>

      <section class="card">
        <label for="apiUrl">API URL</label>
        <input id="apiUrl" type="text" value="http://localhost:8000/v1/getprediction" />

        <label for="imageInput">X-ray image</label>
        <input id="imageInput" type="file" accept="image/*" />

        <button id="submitBtn" type="button">Get Prediction</button>
      </section>

      <section class="card">
        <h2>Preview</h2>
        <img id="preview" alt="Upload preview" />
      </section>

      <section class="card">
        <h2>Plotted Result</h2>
        <canvas id="resultCanvas"></canvas>
        <p id="resultMessage">No prediction yet.</p>
        <div id="anglesPanel" class="angles-panel" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
